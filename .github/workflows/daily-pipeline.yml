name: Daily Content Automation Pipeline

on:
  schedule:
    # Runs daily at 12:00 PM UTC
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      custom_topic:
        description: 'Optional custom topic override'
        required: false
        type: string
        default: ''
      skip_publish:
        description: 'Skip social publishing (render only)'
        required: false
        type: boolean
        default: false
      format:
        description: 'Target format'
        required: true
        type: choice
        options:
          - both
          - short
          - long
        default: both

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install Node Dependencies
        run: npm install

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts

      - name: Run Master Content Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}
        run: |
          ARGS=()
          if [ "${{ inputs.skip_publish }}" = "true" ]; then
            ARGS+=("--skip-publish")
          fi
          if [ -n "${{ inputs.custom_topic }}" ]; then
            ARGS+=("--topic=${{ inputs.custom_topic }}")
          fi
          if [ -n "${{ inputs.format }}" ]; then
            ARGS+=("--format=${{ inputs.format }}")
          fi

          echo "Executing pipeline with arguments: ${ARGS[*]}"
          npx tsx scripts/run_pipeline.ts "${ARGS[@]}"

      - name: Upload Generated Video Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-videos-${{ github.run_number }}
          path: |
            out/*.mp4
            temp/*.json
          retention-days: 3

      - name: Commit & Push History Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git diff --staged --quiet || (git commit -m "chore(data): auto-update published content history [skip ci]" && git push)
